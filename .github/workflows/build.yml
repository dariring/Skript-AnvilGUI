name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload plugin jars
        uses: actions/upload-artifact@v4
        with:
          name: Skript-AnvilGUI-build-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            target/*.jar
            !target/original-*.jar
            !target/*-sources.jar
            !target/*-javadoc.jar
          if-no-files-found: error
